<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Каталог — SportShop</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="header">
    <div class="logo">🏆 SportShop</div>
    <nav>
      <a href="index.html">Главная</a>
      <a href="shop.html">Каталог</a>
      <a href="cart.html">Корзина</a>
    </nav>
  </header>

  <main class="page">
    <h1>Каталог товаров</h1>

    <div class="controls">
      <input id="searchInput" type="text" placeholder="Поиск товара...">
      <select id="categoryFilter">
        <option value="all">Все категории</option>
        <option value="shoes">Кроссовки</option>
        <option value="balls">Мячи</option>
        <option value="clothes">Одежда</option>
        <option value="fitness">Фитнес</option>
      </select>
    </div>

    <div id="products" class="products"></div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
